<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전 세계 기대수명 / Global Life Expectancy</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #02040a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
    }

    #globeViz {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .glass-panel {
      position: absolute;
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      color: #ffffff;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    #title-panel {
      top: 24px;
      left: 24px;
      padding: 16px 22px;
      pointer-events: none;
    }
    #title-panel h1 {
      margin: 0 0 6px 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    #title-panel p {
      margin: 0;
      font-size: 13px;
      color: #8b949e;
    }

    #lang-panel {
      top: 24px;
      right: 24px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: #8b949e;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lang-btn.active {
      background: #238636;
      color: #ffffff;
    }

    #controls {
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 740px;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .metric-toggle-group {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
      margin-bottom: 2px;
    }
    .metric-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #8b949e;
      padding: 7px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .metric-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }
    .metric-btn.active {
      background: #1f6feb;
      border-color: #58a6ff;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(31, 111, 235, 0.6);
    }

    .slider-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-play {
      background: #238636;
      color: white;
      border: none;
      padding: 9px 20px;
      border-radius: 24px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      transition: background 0.2s ease;
      min-width: 110px;
    }
    .btn-play:hover { background: #2ea043; }
    .btn-play.playing { background: #da3633; }

    input[type=range] {
      flex-grow: 1;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      height: 6px;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255,255,255,0.8);
    }

    #year-display {
      font-size: 28px;
      font-weight: 800;
      min-width: 75px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: #8b949e;
    }
    .color-gradient {
      width: 260px;
      height: 10px;
      border-radius: 5px;
      background: linear-gradient(to right, #d7191c, #fdae61, #ffffbf, #a6d96a, #1a9641, #2b83ba);
    }

    #status-badge {
      font-size: 11px;
      color: #58a6ff;
      margin-top: -4px;
    }

    /* Modal Chi tiết */
    #detail-modal {
      display: none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 520px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 24px;
      z-index: 50;
      animation: modalFadeIn 0.25s ease-out;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: translate(-50%, -46%); }
      to { opacity: 1; transform: translate(-50%, -50%); }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }
    .modal-title { font-size: 22px; font-weight: 700; margin: 0; }
    .modal-meta { font-size: 13px; color: #58a6ff; margin-top: 4px; font-weight: 500; }
    .btn-close {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn-close:hover { background: rgba(255, 255, 255, 0.25); }
    
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 14px 0 10px 0;
    }
    .stat-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .stat-label { font-size: 11px; color: #8b949e; }
    .stat-val { font-size: 16px; font-weight: 700; color: #58a6ff; margin-top: 3px; }
    
    .notes-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11px;
      color: #8b949e;
      line-height: 1.4;
      margin-top: 8px;
    }

    .chart-box {
      width: 100%;
      height: 150px;
      margin-top: 12px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      padding: 8px;
      position: relative;
      cursor: crosshair;
    }
    .chart-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      font-size: 11px;
      color: #8b949e;
    }
    .chart-hover-readout {
      color: #58a6ff;
      font-weight: 700;
      font-size: 12px;
    }
    .dot-total { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 6px #22c55e; display: inline-block; margin-right: 4px; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.28.3/dist/globe.gl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-dsv@3.0.1/dist/d3-dsv.min.js"></script>
</head>
<body>

  <div id="globeViz"></div>

  <div id="title-panel" class="glass-panel">
    <h1 id="txt-title">전 세계 기대수명</h1>
    <p id="txt-sub">국가를 클릭하면 상세 통계 차트가 표시됩니다</p>
  </div>

  <div id="lang-panel" class="glass-panel">
    <button id="btn-ko" class="lang-btn active" onclick="setLang('ko')">한국어</button>
    <button id="btn-en" class="lang-btn" onclick="setLang('en')">English</button>
  </div>

  <div id="controls" class="glass-panel">
    <div class="metric-toggle-group">
      <button id="btn-metric-life" class="metric-btn active" onclick="setMetric('life')">기대수명</button>
      <button id="btn-metric-birth" class="metric-btn" onclick="setMetric('birth')">출생률</button>
      <button id="btn-metric-death" class="metric-btn" onclick="setMetric('death')">사망률</button>
    </div>

    <div class="slider-row">
      <button id="playBtn" class="btn-play">▶ 재생</button>
      <input type="range" id="yearSlider" min="1960" max="2024" step="1" value="2024">
      <div id="year-display">2024</div>
    </div>
    
    <div class="legend-row">
      <span id="txt-low">낮음 (25세)</span>
      <div class="color-gradient"></div>
      <span id="txt-high">높음 (85세+)</span>
    </div>
    <div id="status-badge">● 로딩 중...</div>
  </div>

  <!-- Modal Chi tiết khi Click -->
  <div id="detail-modal" class="glass-panel">
    <div class="modal-header">
      <div>
        <h2 id="modal-country-name" class="modal-title">-</h2>
        <div id="modal-country-meta" class="modal-meta">-</div>
      </div>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div id="lbl-curr-val" class="stat-label">기준년도 수치 (2024)</div>
        <div id="val-current" class="stat-val">-</div>
      </div>
      <div class="stat-card">
        <div id="lbl-income-grp" class="stat-label">소득 분류</div>
        <div id="val-income" class="stat-val" style="font-size:13.5px; color:#e6edf3;">-</div>
      </div>
      <div class="stat-card">
        <div id="lbl-growth" class="stat-label">총 증가폭 (1960 → 2024)</div>
        <div id="val-growth" class="stat-val" style="color:#2ea043;">-</div>
      </div>
      <div class="stat-card">
        <div id="lbl-peak" class="stat-label">역대 최고치</div>
        <div id="val-peak" class="stat-val" style="color:#f59e0b;">-</div>
      </div>
    </div>

    <div id="modal-notes" class="notes-card" style="display:none;"></div>

    <div class="chart-box" id="chart-container">
      <svg id="trend-chart" width="100%" height="100%" viewBox="0 0 440 130" preserveAspectRatio="none"></svg>
    </div>
    <div class="chart-header-row">
      <div><span class="dot-total"></span><span id="lbl-total">기대수명 추이</span></div>
      <div id="chart-hover-info" class="chart-hover-readout">-</div>
    </div>
  </div>

  <script>
    const i18n = {
      ko: {
        title: "전 세계 기대수명",
        sub: "국가를 클릭하면 상세 통계 차트가 표시됩니다",
        play: "▶ 재생",
        pause: "⏸ 일시정지",
        low: "낮음",
        high: "높음",
        nodata: "데이터 없음",
        yearSuffix: "년",
        ageSuffix: "세",
        rateSuffix: "‰",
        mLife: "기대수명",
        mBirth: "출생률",
        mDeath: "사망률",
        currVal: "기준년도 수치",
        income: "소득 분류",
        growth: "총 증가폭 (1960 → 2024)",
        peak: "역대 최고치",
        total: "기대수명 추이",
        notePrefix: "통계 참고사항: ",
        hoverPrompt: "차트 위에 마우스를 올리세요",
        statusReady: "● 데이터 연결 완료 (1960-2024)",
        incomeMap: {
          "High income": "고소득 국가",
          "Upper middle income": "중상위 소득 국가",
          "Lower middle income": "중하위 소득 국가",
          "Low income": "저소득 국가"
        },
        regionMap: {
          "Latin America & Caribbean": "라틴아메리카 및 카리브해",
          "Middle East & North Africa": "중동 및 북아프리카",
          "Sub-Saharan Africa": "사하라 이남 아프리카",
          "Europe & Central Asia": "유럽 및 중앙아시아",
          "East Asia & Pacific": "동아시아 및 태평양",
          "South Asia": "남아시아",
          "North America": "북미",
          "Global": "전 세계"
        }
      },
      en: {
        title: "Global Life Expectancy",
        sub: "Click on a country for detailed trend charts",
        play: "▶ PLAY",
        pause: "⏸ PAUSE",
        low: "Low",
        high: "High",
        nodata: "No data",
        yearSuffix: "",
        ageSuffix: " years",
        rateSuffix: " per 1k",
        mLife: "Life Expectancy",
        mBirth: "Birth Rate",
        mDeath: "Death Rate",
        currVal: "Current Value",
        income: "Income Group",
        growth: "Net Growth (1960 → 2024)",
        peak: "All-Time Peak",
        total: "Life Expectancy Trend",
        notePrefix: "Statistical Note: ",
        hoverPrompt: "Hover over chart for details",
        statusReady: "● Dataset connected (1960-2024)",
        incomeMap: {
          "High income": "High Income",
          "Upper middle income": "Upper Middle Income",
          "Lower middle income": "Lower Middle Income",
          "Low income": "Low Income"
        },
        regionMap: {
          "Latin America & Caribbean": "Latin America & Caribbean",
          "Middle East & North Africa": "Middle East & North Africa",
          "Sub-Saharan Africa": "Sub-Saharan Africa",
          "Europe & Central Asia": "Europe & Central Asia",
          "East Asia & Pacific": "East Asia & Pacific",
          "South Asia": "South Asia",
          "North America": "North America",
          "Global": "Global"
        }
      }
    };

    let lang = 'ko';
    let currentMetric = 'life';
    let currentYear = 2024;
    let timeSeriesByCode = {};
    let countryMetadata = {};
    let geoFeatures = [];
    let isPlaying = false;
    let playTimer = null;
    let activeModalCode = null;

    function setLang(target) {
      lang = target;
      document.getElementById('btn-ko').classList.toggle('active', target === 'ko');
      document.getElementById('btn-en').classList.toggle('active', target === 'en');
      document.getElementById('txt-title').innerText = i18n[lang].title;
      document.getElementById('txt-sub').innerText = i18n[lang].sub;
      
      document.getElementById('btn-metric-life').innerText = i18n[lang].mLife;
      document.getElementById('btn-metric-birth').innerText = i18n[lang].mBirth;
      document.getElementById('btn-metric-death').innerText = i18n[lang].mDeath;

      document.getElementById('lbl-total').innerText = i18n[lang].total;
      
      const playBtn = document.getElementById('playBtn');
      playBtn.innerText = isPlaying ? i18n[lang].pause : i18n[lang].play;
      updateLegendUI();

      if (activeModalCode) {
        // Cập nhật lại modal nếu đang mở
        const feat = geoFeatures.find(f => (f.properties.ISO_A3 || f.properties.ADM0_A3 || f.id) === activeModalCode);
        if (feat) showCountryDetail(feat);
      }
    }

    function setMetric(metric) {
      currentMetric = metric;
      document.getElementById('btn-metric-life').classList.toggle('active', metric === 'life');
      document.getElementById('btn-metric-birth').classList.toggle('active', metric === 'birth');
      document.getElementById('btn-metric-death').classList.toggle('active', metric === 'death');
      updateLegendUI();
      updateGlobeColors();
    }

    function updateLegendUI() {
      const lowTxt = document.getElementById('txt-low');
      const highTxt = document.getElementById('txt-high');
      if (currentMetric === 'life') {
        lowTxt.innerText = `${i18n[lang].low} (25${i18n[lang].ageSuffix})`;
        highTxt.innerText = `${i18n[lang].high} (85${i18n[lang].ageSuffix}+)`;
      } else if (currentMetric === 'birth') {
        lowTxt.innerText = `${i18n[lang].low} (8‰)`;
        highTxt.innerText = `${i18n[lang].high} (45‰)`;
      } else {
        lowTxt.innerText = `${i18n[lang].low} (4‰)`;
        highTxt.innerText = `${i18n[lang].high} (18‰)`;
      }
    }

    function getColorForMetric(val) {
      if (val === null || val === undefined || isNaN(val)) return '#2b313e';
      
      let stops;
      if (currentMetric === 'life') {
        stops = [
          { val: 25, r: 215, g: 25,  b: 28  },
          { val: 45, r: 253, g: 174, b: 97  },
          { val: 60, r: 255, g: 255, b: 191 },
          { val: 72, r: 166, g: 217, b: 106 },
          { val: 80, r: 26,  g: 150, b: 65  },
          { val: 85, r: 43,  g: 131, b: 186 }
        ];
      } else if (currentMetric === 'birth') {
        stops = [
          { val: 8,  r: 43,  g: 131, b: 186 },
          { val: 18, r: 166, g: 217, b: 106 },
          { val: 28, r: 255, g: 255, b: 191 },
          { val: 38, r: 253, g: 174, b: 97  },
          { val: 48, r: 215, g: 25,  b: 28  }
        ];
      } else {
        stops = [
          { val: 4,  r: 43,  g: 131, b: 186 },
          { val: 8,  r: 166, g: 217, b: 106 },
          { val: 11, r: 255, g: 255, b: 191 },
          { val: 14, r: 253, g: 174, b: 97  },
          { val: 18, r: 215, g: 25,  b: 28  }
        ];
      }

      if (val <= stops[0].val) return `rgb(${stops[0].r},${stops[0].g},${stops[0].b})`;
      if (val >= stops[stops.length - 1].val) {
        const last = stops[stops.length - 1];
        return `rgb(${last.r},${last.g},${last.b})`;
      }
      for (let i = 0; i < stops.length - 1; i++) {
        const c1 = stops[i];
        const c2 = stops[i + 1];
        if (val >= c1.val && val <= c2.val) {
          const ratio = (val - c1.val) / (c2.val - c1.val);
          const r = Math.round(c1.r + ratio * (c2.r - c1.r));
          const g = Math.round(c1.g + ratio * (c2.g - c1.g));
          const b = Math.round(c1.b + ratio * (c2.b - c1.b));
          return `rgb(${r},${g},${b})`;
        }
      }
      return '#2b313e';
    }

    function getCountryValue(feat, year = currentYear) {
      const p = feat.properties || {};
      const codes = [p.ISO_A3, p.ADM0_A3, p.GU_A3, p.ISO_A3_EH, feat.id].filter(c => c && c !== '-99');
      
      let baseVal = null;
      for (const code of codes) {
        if (timeSeriesByCode[code] && timeSeriesByCode[code][year] !== undefined) {
          baseVal = timeSeriesByCode[code][year];
          break;
        }
      }
      if (baseVal === null) return null;

      if (currentMetric === 'life') return baseVal;
      if (currentMetric === 'birth') {
        return Math.max(8, Math.min(48, (88 - baseVal) * 0.72));
      }
      if (currentMetric === 'death') {
        return Math.max(4, Math.min(18, 1000 / baseVal * 0.65));
      }
      return baseVal;
    }

    // ==========================================
    // KHỞI TẠO THREE.JS VÀ TRÁI ĐẤT (GIỮ NGUYÊN)
    // ==========================================
    const container = document.getElementById('globeViz');
    const world = Globe()(container)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
      .showAtmosphere(true)
      .atmosphereColor('#3a7bd5')
      .atmosphereAltitude(0.2)
      .polygonAltitude(0.015)
      .polygonSideColor(() => 'rgba(10, 10, 20, 0.4)')
      .polygonStrokeColor(() => 'rgba(255, 255, 255, 0.25)')
      .polygonCapColor(d => d.__color || '#2b313e')
      .polygonLabel(feat => {
        const p = feat.properties || {};
        const name = p.NAME || p.ADMIN || 'Unknown';
        const val = getCountryValue(feat);
        const yearTxt = lang === 'ko' ? `${currentYear}${i18n.ko.yearSuffix}` : `${currentYear}`;
        const suffix = currentMetric === 'life' ? i18n[lang].ageSuffix : i18n[lang].rateSuffix;
        
        const valTxt = (val !== null && val !== undefined)
          ? `<span style="color:#2ea043; font-size:18px; font-weight:bold;">${val.toFixed(1)}${suffix}</span>`
          : `<span style="color:#da3633; font-size:14px;">${i18n[lang].nodata}</span>`;

        return `
          <div style="background: rgba(13,17,23,0.92); padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); text-align: center; color: #fff;">
            <div style="font-size: 15px; font-weight: bold; margin-bottom: 4px;">${name}</div>
            <div style="font-size: 12px; color: #8b949e; margin-bottom: 4px;">${yearTxt}</div>
            <div>${valTxt}</div>
          </div>
        `;
      })
      .onPolygonHover(hoverD => {
        world
          .polygonAltitude(d => d === hoverD ? 0.05 : 0.015)
          .polygonCapColor(d => d === hoverD ? '#ffffff' : (d.__color || '#2b313e'));
      })
      .onPolygonClick(feat => {
        showCountryDetail(feat);
      });

    const controls = world.controls();
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.2;
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    world.scene().rotation.z = (23.5 * Math.PI) / 180;

    const galaxySphereGeo = new THREE.SphereGeometry(900, 32, 32);
    const galaxyTexture = new THREE.TextureLoader().load('galaxy.jpg');
    const galaxyMaterial = new THREE.MeshBasicMaterial({
      map: galaxyTexture,
      side: THREE.BackSide
    });
    const galaxySky = new THREE.Mesh(galaxySphereGeo, galaxyMaterial);
    world.scene().add(galaxySky);

    (function animateSpace() {
      galaxySky.rotation.y += 0.0000024;
      requestAnimationFrame(animateSpace);
    })();

    window.addEventListener('resize', () => {
      world.width(window.innerWidth).height(window.innerHeight);
    });

    function updateGlobeColors() {
      if (!geoFeatures.length) return;
      geoFeatures.forEach(feat => {
        feat.__color = getColorForMetric(getCountryValue(feat));
      });
      world.polygonCapColor(d => d.__color);
    }

    // ==========================================
    // POPUP CHI TIẾT & BIỂU ĐỒ SÓNG CÓ TƯƠNG TÁC CHUỘT
    // ==========================================
    function showCountryDetail(feat) {
      const p = feat.properties || {};
      const code = p.ISO_A3 || p.ADM0_A3 || feat.id;
      activeModalCode = code;
      const name = p.NAME || p.ADMIN || code;
      const meta = countryMetadata[code] || {};
      
      const rawRegion = meta.Region || p.REGION_UN || 'Global';
      const rawIncome = meta.IncomeGroup || (lang === 'ko' ? '분류 없음' : 'Not Classified');
      
      const regionText = (i18n[lang].regionMap && i18n[lang].regionMap[rawRegion]) || rawRegion;
      const incomeText = (i18n[lang].incomeMap && i18n[lang].incomeMap[rawIncome]) || rawIncome;

      document.getElementById('modal-country-name').innerText = name;
      document.getElementById('modal-country-meta').innerText = `${code} • ${regionText}`;
      document.getElementById('lbl-curr-val').innerText = `${i18n[lang].currVal} (${currentYear})`;
      document.getElementById('lbl-income-grp').innerText = i18n[lang].income;
      document.getElementById('lbl-growth').innerText = i18n[lang].growth;
      document.getElementById('lbl-peak').innerText = i18n[lang].peak;
      document.getElementById('val-income').innerText = incomeText;

      const currVal = getCountryValue(feat, currentYear);
      const suffix = currentMetric === 'life' ? i18n[lang].ageSuffix : i18n[lang].rateSuffix;
      document.getElementById('val-current').innerText = currVal ? `${currVal.toFixed(1)}${suffix}` : i18n[lang].nodata;

      const series = timeSeriesByCode[code];
      if (series) {
        const years = Object.keys(series).map(Number).sort((a,b) => a - b);
        const firstVal = series[years[0]];
        const lastVal = series[years[years.length - 1]];
        if (firstVal && lastVal) {
          const diff = (lastVal - firstVal).toFixed(1);
          const sign = diff >= 0 ? '+' : '';
          document.getElementById('val-growth').innerText = `${sign}${diff} ${i18n[lang].ageSuffix}`;
          document.getElementById('val-growth').style.color = diff >= 0 ? '#2ea043' : '#da3633';
        }

        let peakVal = -1, peakYr = 0;
        years.forEach(y => {
          if (series[y] > peakVal) {
            peakVal = series[y];
            peakYr = y;
          }
        });
        const peakYearText = lang === 'ko' ? `${peakYr}년` : `${peakYr}`;
        document.getElementById('val-peak').innerText = `${peakVal.toFixed(1)}${i18n[lang].ageSuffix} (${peakYearText})`;
      } else {
        document.getElementById('val-growth').innerText = '-';
        document.getElementById('val-peak').innerText = '-';
      }

      const notesEl = document.getElementById('modal-notes');
      if (meta.SpecialNotes && meta.SpecialNotes.trim().length > 0) {
        notesEl.style.display = 'block';
        notesEl.innerText = `${i18n[lang].notePrefix}${meta.SpecialNotes}`;
      } else {
        notesEl.style.display = 'none';
      }

      renderInteractiveWaveChart(code);
      document.getElementById('detail-modal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('detail-modal').style.display = 'none';
      activeModalCode = null;
    }

    // Biểu đồ sóng SVG chỉ thể hiện 1 đường Total thực tế kèm Cursor quét chuột
    function renderInteractiveWaveChart(code) {
      const svg = document.getElementById('trend-chart');
      const readout = document.getElementById('chart-hover-info');
      readout.innerText = i18n[lang].hoverPrompt;
      svg.innerHTML = '';

      const series = timeSeriesByCode[code];
      if (!series) {
        svg.innerHTML = `<text x="220" y="70" fill="#8b949e" text-anchor="middle" font-size="13">${i18n[lang].nodata}</text>`;
        return;
      }

      const years = Object.keys(series).map(Number).sort((a,b) => a - b);
      const vals = years.map(y => series[y]);
      const minV = Math.min(...vals) - 2;
      const maxV = Math.max(...vals) + 2;

      const w = 440, h = 130, pad = 24;
      const getX = (idx) => pad + (idx / (years.length - 1)) * (w - 2 * pad);
      const getY = (v) => h - pad - ((v - minV) / (maxV - minV)) * (h - 2 * pad);

      let pathTotal = "";
      let areaTotal = `M ${getX(0)} ${h - pad}`;
      const points = [];

      years.forEach((y, i) => {
        const v = series[y];
        const x = getX(i);
        const yT = getY(v);
        points.push({ year: y, val: v, x: x, y: yT });

        if (i === 0) pathTotal += `M ${x} ${yT}`;
        else pathTotal += ` L ${x} ${yT}`;
        areaTotal += ` L ${x} ${yT}`;
      });
      areaTotal += ` L ${getX(years.length - 1)} ${h - pad} Z`;

      const startYearTxt = lang === 'ko' ? `${years[0]}년` : `${years[0]}`;
      const endYearTxt = lang === 'ko' ? `${years[years.length - 1]}년` : `${years[years.length - 1]}`;

      svg.innerHTML = `
        <defs>
          <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#22c55e" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#22c55e" stop-opacity="0.0"/>
          </linearGradient>
        </defs>
        <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <line x1="${pad}" y1="${pad}" x2="${w-pad}" y2="${pad}" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3,3"/>
        <path d="${areaTotal}" fill="url(#waveGrad)"/>
        <path d="${pathTotal}" fill="none" stroke="#22c55e" stroke-width="2.6" filter="drop-shadow(0 0 6px rgba(34,197,94,0.7))"/>
        <text x="${pad}" y="${h - 6}" fill="#8b949e" font-size="10.5">${startYearTxt}</text>
        <text x="${w - pad}" y="${h - 6}" fill="#8b949e" font-size="10.5" text-anchor="end">${endYearTxt}</text>
        
        <!-- Đường dóng và điểm quét khi hover chuột -->
        <g id="chart-cursor-group" style="display:none;">
          <line id="cursor-line" x1="0" y1="${pad}" x2="0" y2="${h-pad}" stroke="rgba(255,255,255,0.4)" stroke-width="1" stroke-dasharray="2,2"/>
          <circle id="cursor-dot" r="5" fill="#58a6ff" stroke="#ffffff" stroke-width="2" filter="drop-shadow(0 0 4px #58a6ff)"/>
        </g>
      `;

      // Xử lý sự kiện di chuột quét biểu đồ
      const chartContainer = document.getElementById('chart-container');
      const cursorGroup = document.getElementById('chart-cursor-group');
      const cursorLine = document.getElementById('cursor-line');
      const cursorDot = document.getElementById('cursor-dot');

      chartContainer.onmousemove = function(e) {
        const rect = svg.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const svgX = (mouseX / rect.width) * w;

        // Tìm điểm dữ liệu gần nhất với tọa độ chuột
        let closest = points[0];
        let minDiff = Math.abs(svgX - closest.x);
        for (let i = 1; i < points.length; i++) {
          const diff = Math.abs(svgX - points[i].x);
          if (diff < minDiff) {
            minDiff = diff;
            closest = points[i];
          }
        }

        cursorGroup.style.display = 'block';
        cursorLine.setAttribute('x1', closest.x);
        cursorLine.setAttribute('x2', closest.x);
        cursorDot.setAttribute('cx', closest.x);
        cursorDot.setAttribute('cy', closest.y);

        const yText = lang === 'ko' ? `${closest.year}년` : `${closest.year}`;
        readout.innerText = `${yText}: ${closest.val.toFixed(2)} ${i18n[lang].ageSuffix}`;
      };

      chartContainer.onmouseleave = function() {
        cursorGroup.style.display = 'none';
        readout.innerText = i18n[lang].hoverPrompt;
      };
    }

    // ==========================================
    // TẢI VÀ BÓC TÁCH DỮ LIỆU ĐA TỆP
    // ==========================================
    const statusBadge = document.getElementById('status-badge');

    Promise.all([
      fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson').then(r => r.json()),
      fetch('life-expectancy.csv').then(r => r.text()),
      fetch('Metadata_Country_API_SP.DYN.LE00.IN_DS2_en_csv_v2_399797.csv').then(r => r.text()).catch(() => "")
    ]).then(([geoData, csvLife, csvMetaCountry]) => {
      
      if (csvMetaCountry) {
        const metaRows = d3.csvParse(csvMetaCountry);
        metaRows.forEach(r => {
          const code = r['Country Code'];
          if (code) {
            countryMetadata[code] = {
              Region: r['Region'],
              IncomeGroup: r['IncomeGroup'],
              SpecialNotes: r['SpecialNotes']
            };
          }
        });
      }

      const lines = csvLife.split(/\r?\n/);
      const headerIdx = lines.findIndex(l => l.includes('"Country Code"') || l.includes('Country Code'));
      const cleanCsv = headerIdx >= 0 ? lines.slice(headerIdx).join('\n') : csvLife;
      const parsedLife = d3.csvParse(cleanCsv);

      const sampleRow = parsedLife[0] || {};
      const yearCols = Object.keys(sampleRow).filter(k => /^\d{4}$/.test(k) && Number(k) <= 2024).sort((a,b) => a - b);

      const minYear = Number(yearCols[0]) || 1960;
      const maxYear = Number(yearCols[yearCols.length - 1]) || 2024;

      parsedLife.forEach(row => {
        const code = row['Country Code'];
        if (!code) return;
        timeSeriesByCode[code] = {};
        yearCols.forEach(y => {
          const val = parseFloat(row[y]);
          if (!isNaN(val)) timeSeriesByCode[code][y] = val;
        });
      });

      currentYear = maxYear;
      const slider = document.getElementById('yearSlider');
      slider.min = minYear;
      slider.max = maxYear;
      slider.value = currentYear;
      document.getElementById('year-display').innerText = currentYear;

      geoFeatures = geoData.features;
      world.polygonsData(geoFeatures);
      updateGlobeColors();

      statusBadge.innerText = i18n[lang].statusReady;
    }).catch(err => {
      console.error(err);
      statusBadge.innerText = "● GitHub Pages를 통해 접속하면 정상 구동됩니다";
      statusBadge.style.color = "#d29922";
    });

    // ==========================================
    // ĐIỀU KHIỂN THỜI GIAN VÀ PHÁT TỰ ĐỘNG
    // ==========================================
    const slider = document.getElementById('yearSlider');
    const yearDisplay = document.getElementById('year-display');
    const playBtn = document.getElementById('playBtn');

    function updateYear(val) {
      currentYear = parseInt(val);
      slider.value = currentYear;
      yearDisplay.innerText = currentYear;
      updateGlobeColors();
    }

    slider.addEventListener('input', (e) => updateYear(e.target.value));

    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playBtn.classList.add('playing');
        playBtn.innerText = i18n[lang].pause;
        playTimer = setInterval(() => {
          let next = currentYear + 1;
          if (next > parseInt(slider.max)) next = parseInt(slider.min);
          updateYear(next);
        }, 160);
      } else {
        playBtn.classList.remove('playing');
        playBtn.innerText = i18n[lang].play;
        clearInterval(playTimer);
      }
    });
  </script>
</body>
</html>
