<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전 세계 기대수명 / Global Life Expectancy</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #05070f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
    }

    #globeViz {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Panel kính mờ (Glassmorphism) */
    .glass-panel {
      position: absolute;
      background: rgba(13, 17, 23, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      color: #ffffff;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    /* Tiêu đề góc trái */
    #title-panel {
      top: 24px;
      left: 24px;
      padding: 16px 22px;
      pointer-events: none;
    }
    #title-panel h1 {
      margin: 0 0 6px 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    #title-panel p {
      margin: 0;
      font-size: 13px;
      color: #8b949e;
    }

    /* Nút chuyển đổi ngôn ngữ góc phải */
    #lang-panel {
      top: 24px;
      right: 24px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: #8b949e;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lang-btn.active {
      background: #238636;
      color: #ffffff;
    }

    /* Bảng điều khiển thời gian ở dưới */
    #controls {
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 720px;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .slider-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-play {
      background: #238636;
      color: white;
      border: none;
      padding: 9px 20px;
      border-radius: 24px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      transition: background 0.2s ease;
      min-width: 110px;
    }
    .btn-play:hover { background: #2ea043; }
    .btn-play.playing { background: #da3633; }

    input[type=range] {
      flex-grow: 1;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      height: 6px;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255,255,255,0.8);
    }

    #year-display {
      font-size: 28px;
      font-weight: 800;
      min-width: 75px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* Chú giải màu (Legend) */
    .legend-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #8b949e;
    }
    .color-gradient {
      width: 220px;
      height: 10px;
      border-radius: 5px;
      background: linear-gradient(to right, #d73027, #f46d43, #fdae61, #fee08b, #66bd63, #1a9850, #1f78b4);
    }
    .no-data-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 14px;
    }
    .no-data-box {
      width: 14px;
      height: 10px;
      background: #2b313e;
      border-radius: 2px;
    }

    /* Trạng thái tải dữ liệu */
    #status-badge {
      font-size: 11px;
      color: #58a6ff;
      margin-top: -6px;
    }
  </style>

  <!-- Nạp thư viện chính xác và tương thích cao -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.28.3/dist/globe.gl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-dsv@3.0.1/dist/d3-dsv.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-scale@4.0.2/dist/d3-scale.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-interpolate@3.0.1/dist/d3-interpolate.min.js"></script>
</head>
<body>

  <div id="globeViz"></div>

  <div id="title-panel" class="glass-panel">
    <h1 id="txt-title">전 세계 기대수명</h1>
    <p id="txt-sub">국가 위로 마우스를 올리면 세부 정보가 표시됩니다</p>
  </div>

  <div id="lang-panel" class="glass-panel">
    <button id="btn-ko" class="lang-btn active" onclick="setLang('ko')">한국어</button>
    <button id="btn-en" class="lang-btn" onclick="setLang('en')">English</button>
  </div>

  <div id="controls" class="glass-panel">
    <div class="slider-row">
      <button id="playBtn" class="btn-play">▶ 재생</button>
      <input type="range" id="yearSlider" min="1950" max="2023" step="1" value="2023">
      <div id="year-display">2023</div>
    </div>
    
    <div class="legend-row">
      <span id="txt-low">낮음 (25세)</span>
      <div class="color-gradient"></div>
      <span id="txt-high">높음 (85세+)</span>
      <div class="no-data-indicator">
        <div class="no-data-box"></div>
        <span id="txt-nodata">데이터 없음</span>
      </div>
    </div>
    <div id="status-badge">● 지구본 3D 구동 중</div>
  </div>

  <script>
    // --- BỘ TỪ ĐIỂN ĐA NGÔN NGỮ ---
    const i18n = {
      ko: {
        title: "전 세계 기대수명",
        sub: "국가 위로 마우스를 올리면 세부 정보가 표시됩니다",
        play: "▶ 재생",
        pause: "⏸ 일시정지",
        low: "낮음 (25세)",
        high: "높음 (85세+)",
        nodata: "데이터 없음",
        yearSuffix: "년",
        ageSuffix: "세",
        statusLoading: "● 데이터 로딩 중...",
        statusReady: "● 데이터 연결 완료"
      },
      en: {
        title: "Global Life Expectancy",
        sub: "Hover over a country for details",
        play: "▶ PLAY",
        pause: "⏸ PAUSE",
        low: "Low (25y)",
        high: "High (85y+)",
        nodata: "No data",
        yearSuffix: "",
        ageSuffix: " years",
        statusLoading: "● Loading dataset...",
        statusReady: "● Dataset loaded"
      }
    };

    let lang = 'ko';
    let currentYear = 2023;
    let lifeDataByYear = {};
    let isPlaying = false;
    let playTimer = null;

    function setLang(target) {
      lang = target;
      document.getElementById('btn-ko').classList.toggle('active', target === 'ko');
      document.getElementById('btn-en').classList.toggle('active', target === 'en');
      
      document.getElementById('txt-title').innerText = i18n[lang].title;
      document.getElementById('txt-sub').innerText = i18n[lang].sub;
      document.getElementById('txt-low').innerText = i18n[lang].low;
      document.getElementById('txt-high').innerText = i18n[lang].high;
      document.getElementById('txt-nodata').innerText = i18n[lang].nodata;
      
      const playBtn = document.getElementById('playBtn');
      playBtn.innerText = isPlaying ? i18n[lang].pause : i18n[lang].play;

      // Cập nhật lại màu và nhãn
      world.polygonsData(world.polygonsData());
    }

    // --- THANG MÀU THEO TUỔI THỌ (25 -> 85+) ---
    const colorScale = d3.scaleLinear()
      .domain([25, 45, 60, 70, 78, 85])
      .range(['#d73027', '#f46d43', '#fee08b', '#66bd63', '#1a9850', '#1f78b4'])
      .clamp(true);

    function getFeatureColor(feat) {
      const code = feat.properties.ISO_A3 || feat.properties.ADM0_A3 || feat.id;
      const val = lifeDataByYear[currentYear] ? lifeDataByYear[currentYear][code] : undefined;
      if (val === undefined || val === null) {
        return '#2b313e'; // Màu xám cho quốc gia thiếu dữ liệu
      }
      return colorScale(val);
    }

    // --- KHỞI TẠO QUẢ CẦU 3D TRÁI ĐẤT ---
    const container = document.getElementById('globeViz');
    const world = Globe()(container)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
      .backgroundImageUrl('galaxy.jpg')
      .showAtmosphere(true)
      .atmosphereColor('#3a7bd5')
      .atmosphereAltitude(0.18)
      .polygonAltitude(0.015)
      .polygonSideColor(() => 'rgba(10, 10, 20, 0.5)')
      .polygonStrokeColor(() => 'rgba(255, 255, 255, 0.15)')
      .polygonCapColor(getFeatureColor)
      .polygonLabel(feat => {
        const code = feat.properties.ISO_A3 || feat.properties.ADM0_A3 || feat.id;
        const name = feat.properties.NAME || feat.properties.ADMIN || code;
        const val = lifeDataByYear[currentYear] ? lifeDataByYear[currentYear][code] : null;
        
        const yearTxt = lang === 'ko' ? `${currentYear}${i18n.ko.yearSuffix}` : `${currentYear}`;
        const valTxt = val !== null 
          ? `<span style="color:#2ea043; font-size:18px; font-weight:bold;">${val.toFixed(1)}${i18n[lang].ageSuffix}</span>`
          : `<span style="color:#da3633; font-size:14px;">${i18n[lang].nodata}</span>`;

        return `
          <div style="background: rgba(13,17,23,0.9); padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); text-align: center; color: #fff;">
            <div style="font-size: 15px; font-weight: bold; margin-bottom: 4px;">${name}</div>
            <div style="font-size: 12px; color: #8b949e; margin-bottom: 4px;">${yearTxt}</div>
            <div>${valTxt}</div>
          </div>
        `;
      })
      .onPolygonHover(hoverD => {
        world
          .polygonAltitude(d => d === hoverD ? 0.05 : 0.015)
          .polygonCapColor(d => d === hoverD ? '#ffffff' : getFeatureColor(d));
      });

    // Cài đặt điều khiển và tự xoay quanh trục nghiêng
    const controls = world.controls();
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.0; // 1 vòng trong khoảng 60 giây
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    // Trục nghiêng 23.5 độ của Trái Đất
    world.scene().rotation.z = (23.5 * Math.PI) / 180;

    // Tự động resize theo kích thước màn hình
    window.addEventListener('resize', () => {
      world.width(window.innerWidth).height(window.innerHeight);
    });

    // --- TẢI DỮ LIỆU ĐỊA LÝ & DỮ LIỆU TUỔI THỌ ---
    const statusBadge = document.getElementById('status-badge');
    statusBadge.innerText = i18n[lang].statusLoading;

    // 1. Tải GeoJSON quốc gia
    fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')
      .then(res => res.json())
      .then(geoData => {
        world.polygonsData(geoData.features);
      })
      .catch(err => console.warn('GeoJSON CDN tải chậm:', err));

    // 2. Tải CSV tuổi thọ
    fetch('life-expectancy.csv')
      .then(res => {
        if (!res.ok) throw new Error('Không đọc được file CSV cục bộ');
        return res.text();
      })
      .then(csvText => {
        const parsed = d3.csvParse(csvText);
        let minYear = 2023, maxYear = 1950;

        parsed.forEach(row => {
          const y = parseInt(row.Year);
          const c = row.Code;
          const v = parseFloat(row['Life expectancy']);

          if (!isNaN(y) && c && !isNaN(v)) {
            if (!lifeDataByYear[y]) lifeDataByYear[y] = {};
            lifeDataByYear[y][c] = v;
            if (y < minYear) minYear = y;
            if (y > maxYear) maxYear = y;
          }
        });

        // Cập nhật thanh trượt slider
        const slider = document.getElementById('yearSlider');
        slider.min = minYear;
        slider.max = maxYear;
        slider.value = currentYear;

        statusBadge.innerText = i18n[lang].statusReady;
        world.polygonCapColor(getFeatureColor);
      })
      .catch(err => {
        statusBadge.innerText = "● Chạy dữ liệu mẫu (Cần mở bằng GitHub Pages để đọc CSV)";
        statusBadge.style.color = "#d29922";
      });

    // --- ĐIỀU KHIỂN NĂM & PHÁT TỰ ĐỘNG ---
    const slider = document.getElementById('yearSlider');
    const yearDisplay = document.getElementById('year-display');
    const playBtn = document.getElementById('playBtn');

    function updateYear(val) {
      currentYear = parseInt(val);
      slider.value = currentYear;
      yearDisplay.innerText = currentYear;
      world.polygonCapColor(getFeatureColor);
    }

    slider.addEventListener('input', (e) => updateYear(e.target.value));

    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playBtn.classList.add('playing');
        playBtn.innerText = i18n[lang].pause;
        playTimer = setInterval(() => {
          let next = currentYear + 1;
          if (next > parseInt(slider.max)) next = parseInt(slider.min);
          updateYear(next);
        }, 120);
      } else {
        playBtn.classList.remove('playing');
        playBtn.innerText = i18n[lang].play;
        clearInterval(playTimer);
      }
    });
  </script>
</body>
</html>
