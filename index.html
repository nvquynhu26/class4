<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전 세계 기대수명 / Global Life Expectancy</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #02040a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
    }

    #globeViz {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .glass-panel {
      position: absolute;
      background: rgba(13, 17, 23, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      color: #ffffff;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    #title-panel {
      top: 24px;
      left: 24px;
      padding: 16px 22px;
      pointer-events: none;
    }
    #title-panel h1 {
      margin: 0 0 6px 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    #title-panel p {
      margin: 0;
      font-size: 13px;
      color: #8b949e;
    }

    #lang-panel {
      top: 24px;
      right: 24px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: #8b949e;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lang-btn.active {
      background: #238636;
      color: #ffffff;
    }

    #controls {
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 720px;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .slider-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-play {
      background: #238636;
      color: white;
      border: none;
      padding: 9px 20px;
      border-radius: 24px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      transition: background 0.2s ease;
      min-width: 110px;
    }
    .btn-play:hover { background: #2ea043; }
    .btn-play.playing { background: #da3633; }

    input[type=range] {
      flex-grow: 1;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      height: 6px;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255,255,255,0.8);
    }

    #year-display {
      font-size: 28px;
      font-weight: 800;
      min-width: 75px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #8b949e;
    }
    .color-gradient {
      width: 220px;
      height: 10px;
      border-radius: 5px;
      background: linear-gradient(to right, #d7191c, #fdae61, #ffffbf, #a6d96a, #1a9641, #2b83ba);
    }
    .no-data-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 14px;
    }
    .no-data-box {
      width: 14px;
      height: 10px;
      background: #2b313e;
      border-radius: 2px;
    }

    #status-badge {
      font-size: 11px;
      color: #58a6ff;
      margin-top: -6px;
    }
  </style>

  <!-- Bộ thư viện chuẩn -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.28.3/dist/globe.gl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-dsv@3.0.1/dist/d3-dsv.min.js"></script>
</head>
<body>

  <div id="globeViz"></div>

  <div id="title-panel" class="glass-panel">
    <h1 id="txt-title">전 세계 기대수명</h1>
    <p id="txt-sub">국가 위로 마우스를 올리면 세부 정보가 표시됩니다</p>
  </div>

  <div id="lang-panel" class="glass-panel">
    <button id="btn-ko" class="lang-btn active" onclick="setLang('ko')">한국어</button>
    <button id="btn-en" class="lang-btn" onclick="setLang('en')">English</button>
  </div>

  <div id="controls" class="glass-panel">
    <div class="slider-row">
      <button id="playBtn" class="btn-play">▶ 재생</button>
      <input type="range" id="yearSlider" min="1950" max="2023" step="1" value="2023">
      <div id="year-display">2023</div>
    </div>
    
    <div class="legend-row">
      <span id="txt-low">낮음 (25세)</span>
      <div class="color-gradient"></div>
      <span id="txt-high">높음 (85세+)</span>
      <div class="no-data-indicator">
        <div class="no-data-box"></div>
        <span id="txt-nodata">데이터 없음</span>
      </div>
    </div>
    <div id="status-badge">● 로딩 중...</div>
  </div>

  <script>
    const i18n = {
      ko: {
        title: "전 세계 기대수명",
        sub: "국가 위로 마우스를 올리면 세부 정보가 표시됩니다",
        play: "▶ 재생",
        pause: "⏸ 일시정지",
        low: "낮음 (25세)",
        high: "높음 (85세+)",
        nodata: "데이터 없음",
        yearSuffix: "년",
        ageSuffix: "세",
        statusReady: "● 데이터 연결 완료"
      },
      en: {
        title: "Global Life Expectancy",
        sub: "Hover over a country for details",
        play: "▶ PLAY",
        pause: "⏸ PAUSE",
        low: "Low (25y)",
        high: "High (85y+)",
        nodata: "No data",
        yearSuffix: "",
        ageSuffix: " years",
        statusReady: "● Dataset connected"
      }
    };

    let lang = 'ko';
    let currentYear = 2023;
    let lifeDataByYear = {};
    let lifeDataByName = {};
    let geoFeatures = [];
    let isPlaying = false;
    let playTimer = null;

    function setLang(target) {
      lang = target;
      document.getElementById('btn-ko').classList.toggle('active', target === 'ko');
      document.getElementById('btn-en').classList.toggle('active', target === 'en');
      document.getElementById('txt-title').innerText = i18n[lang].title;
      document.getElementById('txt-sub').innerText = i18n[lang].sub;
      document.getElementById('txt-low').innerText = i18n[lang].low;
      document.getElementById('txt-high').innerText = i18n[lang].high;
      document.getElementById('txt-nodata').innerText = i18n[lang].nodata;
      
      const playBtn = document.getElementById('playBtn');
      playBtn.innerText = isPlaying ? i18n[lang].pause : i18n[lang].play;
    }

    // --- HÀM TÍNH MÀU THUẦN JS (KHÔNG PHỤ THUỘC D3) ---
    // Đi qua các mốc: 25(Đỏ) -> 45(Cam) -> 60(Vàng) -> 72(Xanh lá nhạt) -> 80(Xanh lục) -> 85(Xanh dương)
    const colorStops = [
      { val: 25, r: 215, g: 25,  b: 28  }, // #d7191c
      { val: 45, r: 253, g: 174, b: 97  }, // #fdae61
      { val: 60, r: 255, g: 255, b: 191 }, // #ffffbf
      { val: 72, r: 166, g: 217, b: 106 }, // #a6d96a
      { val: 80, r: 26,  g: 150, b: 65  }, // #1a9641
      { val: 85, r: 43,  g: 131, b: 186 }  // #2b83ba
    ];

    function interpolateColor(val) {
      if (val <= colorStops[0].val) return `rgb(${colorStops[0].r},${colorStops[0].g},${colorStops[0].b})`;
      if (val >= colorStops[colorStops.length - 1].val) {
        const last = colorStops[colorStops.length - 1];
        return `rgb(${last.r},${last.g},${last.b})`;
      }
      for (let i = 0; i < colorStops.length - 1; i++) {
        const c1 = colorStops[i];
        const c2 = colorStops[i + 1];
        if (val >= c1.val && val <= c2.val) {
          const ratio = (val - c1.val) / (c2.val - c1.val);
          const r = Math.round(c1.r + ratio * (c2.r - c1.r));
          const g = Math.round(c1.g + ratio * (c2.g - c1.g));
          const b = Math.round(c1.b + ratio * (c2.b - c1.b));
          return `rgb(${r},${g},${b})`;
        }
      }
      return '#2b313e';
    }

    // Tra cứu giá trị tuổi thọ của quốc gia
    function getCountryValue(feat) {
      const p = feat.properties || {};
      const codes = [p.ISO_A3, p.ADM0_A3, p.GU_A3, p.ISO_A3_EH, feat.id].filter(c => c && c !== '-99');
      const yearObj = lifeDataByYear[currentYear];
      
      if (yearObj) {
        for (const code of codes) {
          if (yearObj[code] !== undefined) return yearObj[code];
        }
      }

      // Fallback tìm theo tên nếu mã ISO bị thiếu
      const nameObj = lifeDataByName[currentYear];
      if (nameObj) {
        const names = [p.NAME, p.ADMIN, p.SOVEREIGNT, p.NAME_LONG].filter(Boolean);
        for (const name of names) {
          if (nameObj[name] !== undefined) return nameObj[name];
        }
      }
      return null;
    }

    function calculateCapColor(feat) {
      const val = getCountryValue(feat);
      if (val === null || val === undefined) {
        return 'rgba(43, 49, 62, 0.85)'; // Màu xám tối khi không có số liệu
      }
      return interpolateColor(val); // Màu RGB rực rỡ theo tuổi thọ
    }

    // --- KHỞI TẠO QUẢ CẦU ---
    const container = document.getElementById('globeViz');
    const world = Globe()(container)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
      .showAtmosphere(true)
      .atmosphereColor('#3a7bd5')
      .atmosphereAltitude(0.2)
      .polygonAltitude(0.015)
      .polygonSideColor(() => 'rgba(10, 10, 20, 0.4)')
      .polygonStrokeColor(() => 'rgba(255, 255, 255, 0.25)')
      .polygonCapColor(calculateCapColor)
      .polygonLabel(feat => {
        const p = feat.properties || {};
        const name = p.NAME || p.ADMIN || 'Unknown';
        const val = getCountryValue(feat);
        
        const yearTxt = lang === 'ko' ? `${currentYear}${i18n.ko.yearSuffix}` : `${currentYear}`;
        const valTxt = (val !== null && val !== undefined)
          ? `<span style="color:#2ea043; font-size:18px; font-weight:bold;">${val.toFixed(1)}${i18n[lang].ageSuffix}</span>`
          : `<span style="color:#da3633; font-size:14px;">${i18n[lang].nodata}</span>`;

        return `
          <div style="background: rgba(13,17,23,0.92); padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); text-align: center; color: #fff;">
            <div style="font-size: 15px; font-weight: bold; margin-bottom: 4px;">${name}</div>
            <div style="font-size: 12px; color: #8b949e; margin-bottom: 4px;">${yearTxt}</div>
            <div>${valTxt}</div>
          </div>
        `;
      })
      .onPolygonHover(hoverD => {
        world
          .polygonAltitude(d => d === hoverD ? 0.05 : 0.015)
          .polygonCapColor(d => d === hoverD ? '#ffffff' : calculateCapColor(d));
      });

    // --- TỐC ĐỘ XOAY ÊM DỊU ---
    const controls = world.controls();
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.2;
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    // Trục nghiêng 23.5 độ
    world.scene().rotation.z = (23.5 * Math.PI) / 180;

    // --- BACKGROUND VŨ TRỤ CHUYỂN ĐỘNG SIÊU CHẬM ---
    const galaxySphereGeo = new THREE.SphereGeometry(900, 32, 32);
    const galaxyTexture = new THREE.TextureLoader().load('galaxy.jpg');
    const galaxyMaterial = new THREE.MeshBasicMaterial({
      map: galaxyTexture,
      side: THREE.BackSide
    });
    const galaxySky = new THREE.Mesh(galaxySphereGeo, galaxyMaterial);
    world.scene().add(galaxySky);

    (function animateSpace() {
      galaxySky.rotation.y += 0.000012;
      requestAnimationFrame(animateSpace);
    })();

    window.addEventListener('resize', () => {
      world.width(window.innerWidth).height(window.innerHeight);
    });

    // --- HÀM ÉP RENDER LẠI TOÀN BỘ MÀU TỨC THÌ ---
    function triggerColorUpdate() {
      // Truyền một instance function mới ép Globe.gl giải phóng cache vật liệu cũ
      world.polygonCapColor(d => calculateCapColor(d));
    }

    // --- TẢI DỮ LIỆU ---
    const statusBadge = document.getElementById('status-badge');

    Promise.all([
      fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson').then(r => r.json()),
      fetch('life-expectancy.csv').then(r => r.text())
    ]).then(([geoData, csvText]) => {
      const parsed = d3.csvParse(csvText);
      let minYear = 2023, maxYear = 1950;

      parsed.forEach(row => {
        const y = parseInt(row.Year);
        const c = row.Code;
        const name = row.Entity;
        const v = parseFloat(row['Life expectancy']);

        if (!isNaN(y) && !isNaN(v)) {
          if (!lifeDataByYear[y]) lifeDataByYear[y] = {};
          if (!lifeDataByName[y]) lifeDataByName[y] = {};
          if (c) lifeDataByYear[y][c] = v;
          if (name) lifeDataByName[y][name] = v;

          if (y < minYear) minYear = y;
          if (y > maxYear) maxYear = y;
        }
      });

      const slider = document.getElementById('yearSlider');
      slider.min = minYear;
      slider.max = maxYear;
      slider.value = currentYear;

      geoFeatures = geoData.features;
      world.polygonsData(geoFeatures);
      
      // Kích hoạt tô màu ngay khi nạp xong
      triggerColorUpdate();

      statusBadge.innerText = i18n[lang].statusReady;
    }).catch(err => {
      console.error(err);
      statusBadge.innerText = "● Hãy chạy qua GitHub Pages hoặc Live Server để nạp CSV";
      statusBadge.style.color = "#d29922";
    });

    // --- THANH TRƯỢT THỜI GIAN & PLAY/PAUSE ---
    const slider = document.getElementById('yearSlider');
    const yearDisplay = document.getElementById('year-display');
    const playBtn = document.getElementById('playBtn');

    function updateYear(val) {
      currentYear = parseInt(val);
      slider.value = currentYear;
      yearDisplay.innerText = currentYear;
      triggerColorUpdate();
    }

    slider.addEventListener('input', (e) => updateYear(e.target.value));

    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playBtn.classList.add('playing');
        playBtn.innerText = i18n[lang].pause;
        playTimer = setInterval(() => {
          let next = currentYear + 1;
          if (next > parseInt(slider.max)) next = parseInt(slider.min);
          updateYear(next);
        }, 150);
      } else {
        playBtn.classList.remove('playing');
        playBtn.innerText = i18n[lang].play;
        clearInterval(playTimer);
      }
    });
  </script>
</body>
</html>
