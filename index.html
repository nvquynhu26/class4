<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전 세계 기대수명 / Global Life Expectancy</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #030308;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      user-select: none;
    }
    
    #globeViz {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    .glass-panel {
      position: absolute;
      background: rgba(13, 17, 28, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      color: #fff;
      padding: 14px 22px;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    #title-panel { top: 24px; left: 24px; pointer-events: none; }
    #title-panel h1 { margin: 0 0 4px 0; font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    #title-panel p { margin: 0; font-size: 13px; color: #8e9aaf; }

    #lang-toggle-panel {
      top: 24px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #3b82f6;
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px; width: 18px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #10b981; }
    input:checked + .slider:before { transform: translateX(22px); }

    #controls {
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .slider-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-play {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.2s;
      min-width: 95px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-play:hover { background: #1d4ed8; }

    input[type=range] {
      flex-grow: 1;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.18);
      height: 5px;
      border-radius: 3px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #60a5fa;
      cursor: pointer;
      box-shadow: 0 0 10px #3b82f6;
    }

    #year-display {
      font-size: 26px;
      font-weight: 800;
      min-width: 70px;
      text-align: right;
      color: #93c5fd;
      font-variant-numeric: tabular-nums;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: #cbd5e1;
    }
    .color-bar {
      width: 200px;
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(to right, #dc2626, #f59e0b, #10b981, #0284c7, #1e3a8a);
    }
    .no-data {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-left: 10px;
    }
    .no-data-box {
      width: 12px;
      height: 8px;
      background: #2a2e39;
      border: 1px solid #475569;
      border-radius: 2px;
    }

    /* Tooltip */
    .scene-tooltip {
      color: #fff !important;
      background: rgba(15, 23, 42, 0.92) !important;
      padding: 10px 14px !important;
      border-radius: 8px !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6) !important;
      pointer-events: none !important;
    }
  </style>

  <!-- Core Libraries -->
  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl@2.31.1/dist/globe.gl.min.js"></script>
  <script src="https://unpkg.com/d3@7.8.5/dist/d3.min.js"></script>
</head>
<body>

  <div id="globeViz"></div>

  <div id="title-panel" class="glass-panel">
    <h1 id="txt-title">전 세계 기대수명</h1>
    <p id="txt-sub">국가 위로 마우스를 올리면 세부 정보가 표시됩니다</p>
  </div>

  <div id="lang-toggle-panel" class="glass-panel">
    <span id="label-ko" style="color:#60a5fa;">KO</span>
    <label class="switch">
      <input type="checkbox" id="langSwitch">
      <span class="slider"></span>
    </label>
    <span id="label-en" style="color:#64748b;">EN</span>
  </div>

  <div id="controls" class="glass-panel">
    <div class="slider-container">
      <button id="playBtn" class="btn-play">▶ 재생</button>
      <input type="range" id="yearSlider" min="1950" max="2023" step="1" value="2023">
      <div id="year-display">2023</div>
    </div>
    
    <div class="legend">
      <span id="txt-low">낮음 (20)</span>
      <div class="color-bar"></div>
      <span id="txt-high">높음 (85+)</span>
      <div class="no-data">
        <div class="no-data-box"></div>
        <span id="txt-nodata">데이터 없음</span>
      </div>
    </div>
  </div>

  <script>
    const i18n = {
      ko: {
        title: "전 세계 기대수명",
        sub: "국가 위로 마우스를 올리면 세부 정보가 표시됩니다",
        play: "▶ 재생",
        pause: "⏸ 일시정지",
        low: "낮음 (20)",
        high: "높음 (85+)",
        nodata: "데이터 없음",
        yearSuffix: "년",
        unit: "세"
      },
      en: {
        title: "Global Life Expectancy",
        sub: "Hover over a country to explore details",
        play: "▶ PLAY",
        pause: "⏸ PAUSE",
        low: "Low (20)",
        high: "High (85+)",
        nodata: "No data",
        yearSuffix: "",
        unit: "years"
      }
    };

    let currentLang = "ko";
    let currentYear = 2023;
    let lifeDataByYear = {};
    let isPlaying = false;
    let playTimer = null;
    let countriesGeoJson = [];

    // Thang màu: Đỏ -> Vàng -> Xanh lá -> Xanh dương
    const colorScale = d3.scaleLinear()
      .domain([20, 45, 62, 74, 85])
      .range(['#dc2626', '#f59e0b', '#10b981', '#0284c7', '#1e3a8a'])
      .clamp(true);

    function getCountryColor(feat) {
      const code = feat.properties.ISO_A3 || feat.properties.ADM0_A3 || feat.id;
      const val = lifeDataByYear[currentYear] ? lifeDataByYear[currentYear][code] : undefined;
      if (val === undefined || val === null) return '#222733';
      return colorScale(val);
    }

    // --- Khởi tạo Quả cầu 3D ---
    const elem = document.getElementById('globeViz');
    const world = Globe()(elem)
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-water.png')
      .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
      .showAtmosphere(true)
      .atmosphereColor('#3b82f6')
      .atmosphereAltitude(0.18)
      .polygonAltitude(0.012)
      .polygonSideColor(() => 'rgba(15, 23, 42, 0.6)')
      .polygonStrokeColor(() => 'rgba(255, 255, 255, 0.25)')
      .polygonCapColor(getCountryColor)
      .polygonLabel(feat => {
        const code = feat.properties.ISO_A3 || feat.properties.ADM0_A3 || feat.id;
        const val = lifeDataByYear[currentYear] ? lifeDataByYear[currentYear][code] : null;
        const dict = i18n[currentLang];
        const countryName = feat.properties.NAME || feat.properties.ADMIN || code;
        const yearText = currentLang === 'ko' ? `${currentYear}${dict.yearSuffix}` : `${currentYear}`;

        return `
          <div style="font-size:13px; line-height:1.5;">
            <div style="font-weight:700; font-size:15px; color:#fff;">${countryName}</div>
            <div style="color:#94a3b8; font-size:12px;">${yearText}</div>
            <div style="margin-top:4px; font-weight:800; font-size:17px; color:${val ? '#34d399' : '#f87171'};">
              ${val ? val.toFixed(1) + ' ' + dict.unit : dict.nodata}
            </div>
          </div>
        `;
      })
      .onPolygonHover(hoverD => {
        world.polygonAltitude(d => d === hoverD ? 0.05 : 0.012);
      });

    // --- Thiết lập Scene, Camera & Ánh sáng ---
    const scene = world.scene();
    const camera = world.camera();
    const controls = world.controls();

    // 1. Tự xoay: 60s / vòng (chu kỳ ~1 phút), dừng khi click chuột
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.0; 
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 2. Độ nghiêng trục Trái Đất 23.5 độ
    world.scene().rotation.z = (23.5 * Math.PI) / 180;

    // 3. Hệ thống Ánh sáng: Nửa sáng phía trước, nửa tối phía sau
    // Xóa bớt nguồn sáng mặc định của thư viện để kiểm soát bóng tối
    scene.children.filter(c => c.isLight).forEach(l => scene.remove(l));

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.28); // Giữ vừa đủ để vùng tối vẫn đọc được viền lục địa
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 2.2);
    sunLight.position.set(120, 40, 140); // Chiếu từ góc phải chính diện
    scene.add(sunLight);

    // 4. Bầu trời sao 3D & Background Galaxy
    const textureLoader = new THREE.TextureLoader();
    textureLoader.load('galaxy.jpg', (tex) => {
      tex.mapping = THREE.EquirectangularReflectionMapping;
      scene.background = tex;
    }, undefined, () => {
      // Fallback nếu chưa có galaxy.jpg: tạo dải ngân hà bằng hạt 3D
      const starGeo = new THREE.BufferGeometry();
      const starCount = 3000;
      const starPos = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount * 3; i++) {
        starPos[i] = (Math.random() - 0.5) * 1600;
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
      const starMat = new THREE.PointsMaterial({ color: 0xcccccc, size: 1.2, transparent: true, opacity: 0.8 });
      scene.add(new THREE.Points(starGeo, starMat));
    });

    // 5. Mặt Trăng quay quanh Trái Đất
    const moonPivot = new THREE.Group();
    scene.add(moonPivot);

    const moonGeo = new THREE.SphereGeometry(7, 32, 32);
    const moonMat = new THREE.MeshStandardMaterial({
      color: 0xdddddd,
      roughness: 0.9,
      metalness: 0.1
    });

    // Tải texture moon.jpeg
    textureLoader.load('moon.jpeg', (tex) => {
      moonMat.map = tex;
      moonMat.needsUpdate = true;
    });

    const moonMesh = new THREE.Mesh(moonGeo, moonMat);
    moonMesh.position.set(170, 20, 0); // Quỹ đạo xa Trái Đất
    moonPivot.add(moonMesh);

    // Render Loop
    (function animate() {
      moonPivot.rotation.y += 0.003; // Mặt trăng quay quanh Trái Đất
      moonMesh.rotation.y += 0.008;  // Mặt trăng tự quay quanh trục
      controls.update();
      requestAnimationFrame(animate);
    })();

    // --- Tải Dữ liệu (GeoJSON + CSV) ---
    const GEOJSON_URL = 'https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson';

    Promise.all([
      fetch(GEOJSON_URL).then(res => res.json()),
      d3.csv('life-expectancy.csv')
    ]).then(([geoData, csvData]) => {
      countriesGeoJson = geoData.features;

      // Đọc các mốc năm
      const years = csvData.map(d => +d.Year).filter(y => !isNaN(y));
      const minYear = Math.min(...years);
      const maxYear = Math.max(...years);

      const slider = document.getElementById('yearSlider');
      slider.min = minYear;
      slider.max = maxYear;
      slider.value = maxYear;
      currentYear = maxYear;
      document.getElementById('year-display').innerText = currentYear;

      // Gom dữ liệu vào Map để tra cứu tức thì
      csvData.forEach(d => {
        const y = +d.Year;
        const c = d.Code;
        const val = +d['Life expectancy'];
        if (y && c && !isNaN(val)) {
          if (!lifeDataByYear[y]) lifeDataByYear[y] = {};
          lifeDataByYear[y][c] = val;
        }
      });

      // Hiển thị các nước lên quả cầu
      world.polygonsData(countriesGeoJson);

    }).catch(err => {
      console.warn("Lỗi tải online, chuyển sang chế độ dự phòng:", err);
    });

    // --- Điều khiển & Tương tác ---
    const slider = document.getElementById('yearSlider');
    const yearDisp = document.getElementById('year-display');
    const playBtn = document.getElementById('playBtn');

    function setYear(y) {
      currentYear = parseInt(y);
      slider.value = currentYear;
      yearDisp.innerText = currentYear;
      world.polygonCapColor(getCountryColor);
    }

    slider.addEventListener('input', (e) => setYear(e.target.value));

    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      const dict = i18n[currentLang];
      
      if (isPlaying) {
        playBtn.innerText = dict.pause;
        playBtn.style.background = '#dc2626';
        
        playTimer = setInterval(() => {
          let next = currentYear + 1;
          if (next > parseInt(slider.max)) next = parseInt(slider.min);
          setYear(next);
        }, 120);
      } else {
        playBtn.innerText = dict.play;
        playBtn.style.background = '#2563eb';
        clearInterval(playTimer);
      }
    });

    // --- Chuyển ngữ Hàn / Anh ---
    const langSwitch = document.getElementById('langSwitch');
    langSwitch.addEventListener('change', (e) => {
      currentLang = e.target.checked ? 'en' : 'ko';
      const dict = i18n[currentLang];

      document.getElementById('txt-title').innerText = dict.title;
      document.getElementById('txt-sub').innerText = dict.sub;
      document.getElementById('txt-low').innerText = dict.low;
      document.getElementById('txt-high').innerText = dict.high;
      document.getElementById('txt-nodata').innerText = dict.nodata;

      document.getElementById('label-ko').style.color = currentLang === 'ko' ? '#60a5fa' : '#64748b';
      document.getElementById('label-en').style.color = currentLang === 'en' ? '#60a5fa' : '#64748b';

      playBtn.innerText = isPlaying ? dict.pause : dict.play;
      world.polygonCapColor(getCountryColor);
    });

    window.addEventListener('resize', () => {
      world.width(window.innerWidth).height(window.innerHeight);
    });
  </script>
</body>
</html>
